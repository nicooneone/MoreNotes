# XcodeGen project spec. Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen generate
# then open MoreNotes.xcodeproj in Xcode.
name: MoreNotes
options:
  bundleIdPrefix: com.morenotes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MoreNotes:
    type: application
    platform: iOS
    sources:
      - path: MoreNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morenotes.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: MoreNotes/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_INTERFACE_ORIENTATIONS_IPAD: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        # Set your Apple Developer Team ID here (or in Xcode > Signing & Capabilities)
        DEVELOPMENT_TEAM: ""
    info:
      path: MoreNotes/Resources/Info.plist
      properties:
        CFBundleDisplayName: MoreNotes
        CFBundleName: MoreNotes
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: MoreNotes saves exported page images to your photo library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  MoreNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoreNotesTests
    dependencies:
      - target: MoreNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morenotes.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MoreNotes:
    build:
      targets:
        MoreNotes: all
        MoreNotesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoreNotesTests
